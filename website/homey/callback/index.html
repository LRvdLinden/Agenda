<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Weekdot</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; text-align: center;
         font-family: -apple-system, "SF Pro Text", Inter, Roboto, sans-serif; background: #faf9f7; color: #141418; padding: 24px; }
  @media (prefers-color-scheme: dark) { body { background: #0e0e11; color: #f4f4f6; } }
  a { display: inline-block; margin-top: 18px; background: #E8352F; color: #fff; text-decoration: none; font-weight: 600;
      padding: 12px 22px; border-radius: 12px; }
  p { opacity: .7; }
</style>
</head>
<body>
<main>
  <h1>Weekdot</h1>
  <p id="msg">Returning to Weekdot…</p>
  <a id="open" href="weekdot://homey/callback">Open Weekdot</a>
</main>
<script>
  // Homey sign-in sends the user here; hand the code over to the Weekdot app.
  (function () {
    var nl = /^nl\b/i.test(navigator.language || "");
    if (nl) { document.getElementById("msg").textContent = "Terug naar Weekdot…"; document.getElementById("open").textContent = "Open Weekdot"; }
    var url = "weekdot://homey/callback" + window.location.search;
    document.getElementById("open").href = url;
    window.location.replace(url);
  })();
</script>
</body>
</html>
