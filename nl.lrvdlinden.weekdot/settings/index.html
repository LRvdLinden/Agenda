<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script type="text/javascript" src="/homey.js" data-origin="settings"></script>
  <style>
    /* Same look as weekdot.com */
    :root {
      --red: #e8352f; --red-soft: #fdeceb; --ink: #131318; --text: #2c2c34; --muted: #6d6d79; --line: #e8e6e3;
      --bg: #fbfaf8; --card: #ffffff; --ok: #1fa851;
      --font: "Inter", -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Noto Sans", sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      :root { --ink: #f5f5f7; --text: #e2e2e7; --muted: #a3a3ae; --line: #2a2a31; --bg: #0e0e11; --card: #1a1a1f; --red-soft: #3b1715; }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); }
    body { font-family: var(--font); color: var(--text); line-height: 1.55; -webkit-font-smoothing: antialiased; padding: 22px 18px 40px;
      background-image: radial-gradient(color-mix(in srgb, var(--muted) 18%, transparent) 1.2px, transparent 1.2px); background-size: 22px 22px; }
    .hero { text-align: center; margin: 4px 0 26px; }
    .wd-icon { width: 76px; height: 76px; display: block; margin: 0 auto 16px; filter: drop-shadow(0 14px 24px rgba(232, 53, 47, .28)); }
    .dots { display: flex; justify-content: center; gap: 7px; margin-bottom: 14px; }
    .dots i { width: 9px; height: 9px; border-radius: 50%; background: color-mix(in srgb, var(--muted) 35%, transparent); }
    .dots i.on { background: var(--red); box-shadow: 0 0 0 4px color-mix(in srgb, var(--red) 18%, transparent); }
    .kicker { display: inline-flex; align-items: center; gap: 8px; color: var(--red); font-weight: 700; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; margin: 0 0 6px; }
    .kicker::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--red); }
    h1, .hero h1 { font-family: var(--font) !important; font-size: 40px !important; line-height: 1.02 !important; letter-spacing: -.045em !important; margin: 0 0 8px !important; font-weight: 800 !important; color: var(--ink) !important; }
    .lead { color: var(--muted); font-size: 16px; margin: 0; }
    .tile { background: var(--card); border: 1px solid var(--line); border-radius: 22px; padding: 18px 20px; margin: 0 0 14px; }
    .tile h2 { font-size: 17px; letter-spacing: -.01em; color: var(--ink); margin: 0 0 10px; font-weight: 750; }
    .pill { display: inline-flex; align-items: center; gap: 8px; font-weight: 650; font-size: 15px; padding: 6px 12px; border-radius: 999px;
      background: color-mix(in srgb, var(--muted) 12%, transparent); color: var(--muted); }
    .pill::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
    .pill.ok { color: var(--ok); background: color-mix(in srgb, var(--ok) 13%, transparent); }
    .row { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); font-size: 15px; }
    .row:first-of-type { margin-top: 12px; }
    .row span:last-child { color: var(--muted); font-variant-numeric: tabular-nums; text-align: right; }
    .warn { color: var(--red); font-size: 14px; margin: 10px 0 0; }
    .cals { display: flex; flex-wrap: wrap; gap: 8px; }
    .cal { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); font-size: 14px; font-weight: 600; }
    .cal i { width: 10px; height: 10px; border-radius: 50%; }
    ol.steps { list-style: none; padding: 0; margin: 0; counter-reset: s; }
    ol.steps li { counter-increment: s; display: flex; gap: 12px; align-items: flex-start; padding: 7px 0; font-size: 15px; }
    ol.steps li::before { content: counter(s); flex: none; width: 26px; height: 26px; border-radius: 50%; background: var(--red-soft); color: var(--red);
      font-weight: 800; font-size: 13px; display: flex; align-items: center; justify-content: center; margin-top: 1px; }
    .muted { color: var(--muted); font-size: 14px; margin: 10px 0 0; }
    .btn { display: block; width: 100%; font: inherit; font-weight: 650; font-size: 15px; padding: 13px 18px; border-radius: 14px; cursor: pointer;
      border: 1px solid color-mix(in srgb, var(--red) 40%, transparent); background: transparent; color: var(--red); margin: 4px 0 14px; }
    .btn:active { background: var(--red-soft); }
    .foot { text-align: center; font-size: 14px; }
    .foot a { color: var(--red); text-decoration: none; font-weight: 600; }
    .hidden { display: none; }
  </style>
</head>
<body>

    <div class="dots"><i></i><i></i><i></i><i></i><i class="on"></i><i></i><i></i></div>
    <p class="kicker">Homey</p>
    <h1>Weekdot</h1>
    <p class="lead" data-i18n="settings.subtitle"></p>
  </header>

  <section class="tile">
    <h2 data-i18n="settings.status"></h2>
    <span id="state" class="pill"></span>
    <div class="row hidden" id="row-updated"><span data-i18n="settings.updated"></span><span id="updated"></span></div>
    <div class="row hidden" id="row-events"><span data-i18n="settings.events"></span><span id="events"></span></div>
    <p id="stale" class="warn hidden" data-i18n="settings.stale"></p>
  </section>

  <section class="tile hidden" id="cal-box">
    <h2 data-i18n="settings.calendars"></h2>
    <div class="cals" id="cals"></div>
  </section>

  <section class="tile">
    <h2 data-i18n="settings.howto"></h2>
    <ol class="steps">
      <li data-i18n="settings.step1"></li>
      <li data-i18n="settings.step2"></li>
      <li data-i18n="settings.step3"></li>
    </ol>
    <p class="muted" data-i18n="settings.privacy"></p>
  </section>

  <button class="btn hidden" id="clear" data-i18n="settings.clear"></button>
  <p class="foot"><a href="https://weekdot.com" target="_blank" data-i18n="settings.website"></a></p>

  <script type="text/javascript">
    function onHomeyReady(Homey) {
      const $ = id => document.getElementById(id);
      const t = k => Homey.__(k);
      document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.getAttribute('data-i18n')); });

      async function load() {
        let s = null;
        try { s = await Homey.api('GET', '/status'); } catch (e) { /* app starting */ }
        const linked = s && s.linked;
        $('state').textContent = linked ? Homey.__('settings.linked', { device: s.device }) : t('settings.not_linked');
        $('state').className = linked ? 'pill ok' : 'pill';
        ['row-updated', 'row-events', 'cal-box', 'clear'].forEach(id => $(id).classList.toggle('hidden', !linked));
        if (linked) {
          const at = new Date(s.receivedAt);
          $('updated').textContent = at.toLocaleString();
          $('events').textContent = String(s.events);
          $('stale').classList.toggle('hidden', Date.now() - at.getTime() < 2 * 86400000);
          $('cals').innerHTML = '';
          for (const c of s.calendars || []) {
            const chip = document.createElement('span');
            chip.className = 'cal';
            const dot = document.createElement('i'); dot.style.background = c.color;
            chip.append(dot, document.createTextNode(c.title));
            $('cals').appendChild(chip);
          }
        } else {
          $('stale').classList.add('hidden');
        }
      }

      $('clear').addEventListener('click', async () => {
        await Homey.api('DELETE', '/schedule');
        Homey.alert(t('settings.cleared'));
        load();
      });

      load();
      Homey.ready();
    }
  </script>
</body>
