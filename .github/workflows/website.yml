name: Website

# Uploads the website/ folder to the web server via FTPS (encrypted, certificate checked) on every push
# that changes the site, or by hand (Actions › Website › Run workflow).
# Repository secrets: FTP_SERVER, FTP_USER, FTP_PASSWORD; optional FTP_PORT (21 = FTPS, 22 = SFTP) and FTP_DIR.
# Safety: if the target folder already holds a website that is not Weekdot, nothing is uploaded.
on:
  push:
    branches: [main]
    paths: ["website/**", ".github/workflows/website.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: website
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version CSS/JS by content (no stale translations in browsers)
        run: python3 tools/bust_cache.py
      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp
      - name: Upload via FTPS
        id: upload
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USER || secrets.FTP_USERNAME }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_DIR: ${{ secrets.FTP_DIR }}
        run: |
          set -euo pipefail
          note(){ echo "$1" | tee -a "$GITHUB_STEP_SUMMARY"; echo "$1" >> /tmp/report.txt; }
          if [ -z "${FTP_SERVER:-}" ] || [ -z "${FTP_USERNAME:-}" ] || [ -z "${FTP_PASSWORD:-}" ]; then
            note "FTP secrets missing (FTP_SERVER, FTP_USER, FTP_PASSWORD) — website not uploaded."
            exit 1
          fi
          trim(){ printf '%s' "$1" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//'; }
          FTP_SERVER=$(trim "$FTP_SERVER" | sed -E 's#^[a-zA-Z]+://##; s#/.*$##; s#:[0-9]+$##')
          FTP_USERNAME=$(trim "$FTP_USERNAME"); FTP_DIR=$(trim "${FTP_DIR:-}")
          PORT=$(trim "${FTP_PORT:-}" | tr -cd '0-9'); PORT="${PORT:-21}"
          export LFTP_PASSWORD=$(trim "$FTP_PASSWORD")
          CA=/tmp/ftp-ca.pem; cp /etc/ssl/certs/ca-certificates.crt "$CA"
          if [ "$PORT" = "22" ]; then
            # SFTP (SSH): encrypted; the server key is recorded on first use
            mkdir -p ~/.ssh; ssh-keyscan -p 22 -T 20 "$FTP_SERVER" >> ~/.ssh/known_hosts 2>/dev/null || true
            common="set cmd:fail-exit true; set net:max-retries 3; set net:timeout 30; set sftp:auto-confirm no"
            HOST="sftp://$FTP_SERVER"
            note "Connecting with SFTP (port 22)."
          else
            common="set cmd:fail-exit true; set net:max-retries 3; set net:timeout 30; set ftp:passive-mode true; set ftp:ssl-force true; set ftp:ssl-protect-data true; set ssl:verify-certificate yes; set ssl:check-hostname yes; set ssl:ca-file $CA"
            ip_of(){ (getent ahostsv4 "$1" || true) | awk 'NR==1{print $1}'; }
            if [ "$PORT" = "990" ]; then tls="-connect"; else tls="-starttls ftp -connect"; fi
            sc(){ timeout 40 openssl s_client ${tls/-connect/} -connect "$1:$PORT" -servername "$1" "${@:2}" </dev/null 2>/dev/null; }
            add_chain(){
              local aia
              aia=$(sc "$1" | openssl x509 -noout -text 2>/dev/null | grep -oE 'CA Issuers - URI:[^ ]+' | sed 's/CA Issuers - URI://' | head -1 || true)
              [ -n "$aia" ] || return 0
              curl -fsSL --max-time 20 "$aia" -o /tmp/inter.bin 2>/dev/null || return 0
              openssl x509 -inform DER -in /tmp/inter.bin -out /tmp/inter.pem 2>/dev/null || openssl x509 -in /tmp/inter.bin -out /tmp/inter.pem 2>/dev/null || return 0
              cat /tmp/inter.pem >> "$CA"
            }
            cert_ok(){ sc "$1" -verify_hostname "$1" -verify_return_error -CAfile "$CA" | grep -q 'Verify return code: 0 (ok)'; }
            HOST=""
            base_ip=$(ip_of "$FTP_SERVER")
            [ -n "$base_ip" ] || { note "FTP_SERVER does not resolve."; exit 1; }
            add_chain "$FTP_SERVER"
            if cert_ok "$FTP_SERVER"; then HOST="$FTP_SERVER"; else
              names=$(sc "$FTP_SERVER" | openssl x509 -noout -ext subjectAltName -subject 2>/dev/null \
                | grep -oE '(DNS:|CN ?= ?)(\*\.)?[A-Za-z0-9-]+(\.[A-Za-z0-9-]+)+' | sed -E 's/^(DNS:|CN ?= ?)//' | sort -u || true)
              ptr=$(getent hosts "$base_ip" 2>/dev/null | awk '{print $2}' | sed 's/\.$//' || true)
              cands="$ptr"; first="${FTP_SERVER%%.*}"
              for n in $names; do case "$n" in \*.*) cands="$cands $first.${n#\*.} ftp.${n#\*.}";; *) cands="$cands $n";; esac; done
              for n in $(echo $cands | tr ' ' '\n' | sort -u); do
                [ "$(ip_of "$n")" = "$base_ip" ] || continue
                if cert_ok "$n"; then HOST="$n"; break; fi
              done
            fi
            [ -n "$HOST" ] || { note "No valid FTPS certificate found for FTP_SERVER on port $PORT. Set FTP_SERVER to the host name on the hosting certificate."; exit 1; }
            [ "$PORT" = "990" ] && HOST="ftps://$HOST"
          fi
          run(){ lftp -e "$common; open -p $PORT --env-password -u \"$FTP_USERNAME\" \"$HOST\"; $1; bye"; }
          ok=""
          for attempt in 1 2 3; do
            [ "$attempt" -gt 1 ] && sleep 30
            if run "cls -1 > /tmp/root.txt" 2>/tmp/err.txt; then ok=1; break; fi
            echo "Login attempt $attempt failed: $(grep -viE 'user|pass' /tmp/err.txt | tr '\n' ' ' | tail -c 200)"
          done
          if [ -z "$ok" ]; then
            msg=$(grep -viE 'user|pass|@' /tmp/err.txt | tr '\n' ' ' | sed "s/$FTP_USERNAME/***/g" | tail -c 300 || true)
            note "Login to the FTP server failed (host checked: $([ "$HOST" = "$FTP_SERVER" ] && echo FTP_SERVER || echo "$HOST"), port $PORT). Server said: ${msg:-no message}"
            exit 1
          fi
          # target folder: FTP_DIR, else a common web root, else the login folder
          TARGET="$FTP_DIR"
          if [ -z "$TARGET" ]; then
            for d in public_html httpdocs www htdocs; do
              if grep -qx "/\?$d/\?" /tmp/root.txt; then TARGET="$d"; break; fi
            done
          fi
          TARGET="${TARGET:-.}"
          # safety: never overwrite another website
          rm -f /tmp/remote-index.html
          run "get \"$TARGET/index.html\" -o /tmp/remote-index.html" >/dev/null 2>&1 || true
          if [ -s /tmp/remote-index.html ] && ! grep -q "Weekdot" /tmp/remote-index.html; then
            note "Stopped: the target folder already has another website (no Weekdot in index.html). Set the secret FTP_DIR to the folder of the Weekdot domain."
            exit 1
          fi
          run "mirror -R --verbose --parallel=4 --only-newer --exclude-glob .DS_Store --exclude-glob .htaccess website/ \"$TARGET\""
          # .htaccess (clean URLs): keep anything the hoster put there, replace only our block
          rm -f /tmp/htaccess.remote
          run "get \"$TARGET/.htaccess\" -o /tmp/htaccess.remote" >/dev/null 2>&1 || true
          python3 - <<'PY'
          import os, re
          ours = open("website/.htaccess").read().strip("\n")
          old = open("/tmp/htaccess.remote").read() if os.path.exists("/tmp/htaccess.remote") else ""
          old = re.sub(r"\n?# BEGIN weekdot.*?# END weekdot\n?", "\n", old, flags=re.S).strip("\n")
          open("/tmp/htaccess.new", "w").write(ours + ("\n\n" + old if old else "") + "\n")
          PY
          run "put /tmp/htaccess.new -o \"$TARGET/.htaccess\""
          note "Website uploaded (port $PORT) to ${FTP_DIR:+the FTP_DIR folder}${FTP_DIR:-$TARGET} on the server (certificate checked)."
      - name: Report on the commit
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo "### Website: ${{ steps.upload.outcome }}"; cat /tmp/report.txt 2>/dev/null || true; } > comment.md
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -F body=@comment.md >/dev/null
