name: Build

# Compiles Weekdot for iOS/iPadOS, macOS and watchOS (no signing) to catch build errors early.
on:
  push:
    branches: [main]
    paths-ignore: ["website/**", "**.md"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: iOS
            scheme: Weekdot
            destination: generic/platform=iOS Simulator
          - name: macOS
            scheme: Weekdot
            destination: generic/platform=macOS
          - name: watchOS
            scheme: WeekdotWatch
            destination: generic/platform=watchOS Simulator
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode
        run: |
          XC=$(ls -d /Applications/Xcode*.app | grep -vi beta | sort -V | tail -1)
          sudo xcode-select -s "$XC"
          xcodebuild -version
      - name: Build
        run: |
          set +e
          xcodebuild -project Weekdot.xcodeproj -scheme "${{ matrix.scheme }}" \
            -destination "${{ matrix.destination }}" -configuration Debug \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build > build.log 2>&1
          status=$?
          grep -E "error:|BUILD (SUCCEEDED|FAILED)" build.log | sort -u | head -200
          exit $status
      - name: Post warnings summary on the commit
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo "### ${{ matrix.name }}: $(grep -Eo 'BUILD SUCCEEDED' build.log | head -1) — $(xcodebuild -version | head -1)"; \
            echo "Swift files compiled: $(grep -c 'SwiftCompile ' build.log || true)"; echo '```'; \
            grep -E "warning:" build.log | grep -v "ld: warning" | sed "s|$GITHUB_WORKSPACE/||" | sort -u | head -60; echo '```'; } > comment.md
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -F body=@comment.md
      - name: Post errors on the commit
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo "### ${{ matrix.name }} build failed"; echo '```'; grep -E "error:" build.log | sed "s|$GITHUB_WORKSPACE/||" | sort -u | head -120; tail -5 build.log; echo '```'; } > comment.md
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -F body=@comment.md
