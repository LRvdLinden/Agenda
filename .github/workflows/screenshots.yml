name: Screenshots

# Makes App Store / website screenshots in the simulators (screenshot mode with sample data)
# and stores them on the "screenshots" branch.
on:
  workflow_dispatch:
    inputs:
      langs:
        description: "Languages"
        default: "en nl"
      scenes:
        description: "Scenes"
        default: "week month day event list discover sports"
      platforms:
        description: "Platforms (ios watch mac); others keep their shots from the branch"
        default: "ios watch mac"

permissions:
  contents: write

jobs:
  shots:
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode
        run: |
          XC=$(ls -d /Applications/Xcode*.app | grep -vi beta | sort -V | tail -1)
          sudo xcode-select -s "$XC"
          xcodebuild -version
      - name: Take screenshots
        env:
          PLATFORMS: ${{ inputs.platforms }}
        run: tools/screenshots.sh "${{ inputs.langs }}" "${{ inputs.scenes }}"
      - name: Store on the screenshots branch
        run: |
          SRC=$(git rev-parse --short HEAD)
          mkdir -p /tmp/out/shots
          # keep the shots of platforms that were not taken this time
          if git fetch -q origin screenshots; then
            mkdir -p /tmp/prev && git archive origin/screenshots shots | tar -x -C /tmp/prev && cp -R /tmp/prev/shots/. /tmp/out/shots/ || true
          fi
          cp -R shots/. /tmp/out/shots/
          git config user.name "github-actions"; git config user.email "actions@users.noreply.github.com"
          git checkout --orphan screenshots-tmp
          git rm -rf -q . ; git clean -fdq -e dd -e ddmac
          rm -rf dd ddmac
          cp -R /tmp/out/shots ./shots
          git add shots && git commit -qm "Screenshots of $SRC"
          git push -f origin HEAD:screenshots
